name: mapping-legacy-test
title: "Mapping Tested Through the Deprecated MappingTests Block"
description: |
  A relational mapping carrying the deprecated `MappingTests [ ... ]` block —
  `query` / `data` / `assert` triples with `<Relational, CSV, store, '...'>`
  data — instead of a modern `testSuites` block. This is the only distributed
  example of the second of EMIT Phase 5's three runners: it drives the legacy
  `MappingTestRunner`, which sets up H2 from the CSV, plans and executes each
  query, and compares the serialised TDS against the `assert` string. Two tests
  are declared so the per-test loop is exercised rather than a single case.

modelSources:
  model:
    root: mapping-legacy-test
    files:
      - mapping/legacyPersonMapping.pure
  dependencies:
    - source: service-shared-domain.emit.yaml

features:
  - execution:legacy-mapping-test
  - execution:test-data
  - scaffolding:class
  - scaffolding:relational-mapping
  - scaffolding:relational-store
stores:
  - relational
complexity: basic
tags:
  - legacy-mapping-test
  - deprecated
  - h2
  - shared-domain
